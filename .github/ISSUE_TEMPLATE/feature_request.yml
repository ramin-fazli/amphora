name: Feature request
description: Suggest an enhancement for Amphora
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: spec-ref
    attributes:
      label: Relevant Technical Specification section (if any)
