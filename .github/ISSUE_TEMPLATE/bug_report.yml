name: Bug report
description: Report a bug in Amphora
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: input
    id: component
    attributes:
      label: Affected component
      placeholder: "Proxy / Controller / Packing Scheduler / admission webhook / other"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Amphora version / commit
    validations:
      required: true
