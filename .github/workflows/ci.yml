name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # These steps activate once the Go module (go.mod) lands with the operator scaffold.
      - name: Check for Go module
        id: gomod
        run: echo "present=$(test -f go.mod && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        if: steps.gomod.outputs.present == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        if: steps.gomod.outputs.present == 'true'
        run: go vet ./...

      - name: golangci-lint
        if: steps.gomod.outputs.present == 'true'
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - name: go test
        if: steps.gomod.outputs.present == 'true'
        run: go test ./... -race -coverprofile=coverage.out

  vuln-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for Go module
        id: gomod
        run: echo "present=$(test -f go.mod && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Set up Go
        if: steps.gomod.outputs.present == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: govulncheck
        if: steps.gomod.outputs.present == 'true'
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
